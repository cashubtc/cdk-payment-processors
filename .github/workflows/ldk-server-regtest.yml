name: LDK Server Regtest

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'Cargo.lock'
      - 'crates/ldk-server/**'
      - '.github/workflows/ldk-server-regtest.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'Cargo.lock'
      - 'crates/ldk-server/**'
      - '.github/workflows/ldk-server-regtest.yml'

permissions:
  contents: read

concurrency:
  group: ldk-server-regtest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  regtest:
    name: Full LDK Server payment flow
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: crates/ldk-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-ldk-server-regtest-${{ hashFiles('Cargo.lock', 'crates/ldk-server/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-ldk-server-regtest-

      - name: Cache bitcoind
        id: cache-bitcoind
        uses: actions/cache@v6
        with:
          path: crates/ldk-server/bin/bitcoind
          key: bitcoind-29.0-${{ runner.os }}-${{ runner.arch }}

      - name: Download bitcoind
        if: steps.cache-bitcoind.outputs.cache-hit != 'true'
        run: |
          mkdir -p bin
          curl -sfL -o bitcoin.tar.gz \
            https://bitcoincore.org/bin/bitcoin-core-29.0/bitcoin-29.0-x86_64-linux-gnu.tar.gz
          echo "a681e4f6ce524c338a105f214613605bac6c33d58c31dc5135bbc02bc458bb6c  bitcoin.tar.gz" | shasum -a 256 -c
          tar xzf bitcoin.tar.gz
          cp bitcoin-29.0/bin/bitcoind bin/bitcoind

      - name: Export bitcoind environment variable
        run: echo "BITCOIND_EXE=$( pwd )/bin/bitcoind" >> "$GITHUB_ENV"

      - name: Run LDK Server Regtest suite
        timeout-minutes: 75
        run: CARGO_INCREMENTAL=0 RUST_LOG=info cargo test --features regtest-tests --test regtest -- --ignored --nocapture --test-threads=1

      - name: Upload daemon logs and databases
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ldk-server-regtest-${{ github.run_id }}
          path: target/ldk-server-regtest
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
