name: LNbits Regtest

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'crates/lnbits/**'
      - '.github/workflows/lnbits-regtest.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'crates/lnbits/**'
      - '.github/workflows/lnbits-regtest.yml'

permissions:
  contents: read

concurrency:
  group: lnbits-regtest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  LNBITS_REGTEST_IMAGE: lnbits/lnbits:v1.6.0@sha256:dceb42f8a9bedcb868d78e21abde14cf38d76b52bf0cb73c3d87a70af8d693f5
  LNBITS_REGTEST_BITCOIND_IMAGE: boltz/bitcoin-core:25.0@sha256:50b230837cf633d028706991b3fcfe6470790831ca1283d12f5a9d84138a2b62
  LNBITS_REGTEST_LND_IMAGE: boltz/lnd:0.19.3-beta@sha256:3987e077cf8448ed25c461ade38d77f212b995baab4a449897cdfe2965f46d47

jobs:
  regtest:
    name: Full LNbits payment flow
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: crates/lnbits

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-lnbits-regtest-${{ hashFiles('crates/lnbits/Cargo.lock', 'crates/lnbits/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-lnbits-regtest-

      - name: Pull regtest images
        run: |
          docker pull "$LNBITS_REGTEST_BITCOIND_IMAGE"
          docker pull "$LNBITS_REGTEST_LND_IMAGE"
          docker pull "$LNBITS_REGTEST_IMAGE"

      - name: Run LNbits Regtest suite
        timeout-minutes: 45
        run: CARGO_INCREMENTAL=0 RUST_LOG=info cargo test --locked --features regtest-tests --test regtest -- --ignored --nocapture --test-threads=1

      - name: Upload LNbits logs and database
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lnbits-regtest-${{ github.run_id }}
          path: target/lnbits-regtest
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
