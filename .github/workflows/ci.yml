name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  changes:
    name: Detect changed crates
    runs-on: ubuntu-latest
    outputs:
      crates: ${{ steps.filter.outputs.changes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Detect changed crates
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref }}
          filters: |
            bark:
              - 'crates/bark/**'
              - '.github/workflows/ci.yml'
            spark:
              - 'crates/spark/**'
              - '.github/workflows/ci.yml'
            template:
              - 'crates/template/**'
              - '.github/workflows/ci.yml'

  crate:
    name: ${{ matrix.crate }}
    needs: changes
    if: ${{ needs.changes.outputs.crates != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: ${{ fromJSON(needs.changes.outputs.crates) }}
    defaults:
      run:
        working-directory: crates/${{ matrix.crate }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.crate }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml', format('crates/{0}/Cargo.toml', matrix.crate)) }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.crate }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run cargo check
        run: cargo check --all-features

      - name: Run tests
        run: cargo test --all-features

      - name: Run Clippy
        run: cargo clippy --all-features -- -D warnings

      - name: Build release
        run: cargo build --release --all-features
