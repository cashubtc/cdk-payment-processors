[package]
name = "cdk-payment-processor-spark"
version = "0.0.1"
edition = "2021"
authors = ["thesimplekid <tsk@thesimplekid.com>"]
description = "CDK Payment Processor backed by a Spark wallet"
license = "MIT"

[features]
default = []
regtest-tests = [
    "dep:bitcoin",
    "dep:futures",
    "dep:lightning-invoice",
    "dep:spark-itest",
]

[dependencies]
anyhow = "1"
async-trait = "0.1"
cdk-common = { version = "0.17.3", default-features = false, features = ["mint", "grpc"] }
cdk-payment-processor = { version = "0.17.3", default-features = false }
figment = { version = "0.10", features = ["env", "toml"] }
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "process", "sync", "net"] }
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

bip39 = "2.2"
hex = "0.4"
redb = "4.1.0"
spark-wallet = { git = "https://github.com/breez/spark-sdk", tag = "0.22.0" }
tokio-stream = "0.1"

# spark regtest tests
bitcoin = { version = "0.32", optional = true }
futures = { version = "0.3", optional = true }
lightning-invoice = { version = "0.34", optional = true }
spark-itest = { git = "https://github.com/breez/spark-sdk", tag = "0.22.0", optional = true }

[dev-dependencies]
figment = { version = "0.10", features = ["test"] }

[[test]]
name = "regtest"
path = "tests/regtest.rs"
required-features = ["regtest-tests"]
