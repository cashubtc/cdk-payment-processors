[package]
name = "cdk-payment-processor-bark"
version = "0.0.1"
edition = "2021"
authors = ["thesimplekid <tsk@thesimplekid.com>"]
description = "CDK Payment Processor backed by a Bark wallet"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
cdk-common = { version = "0.17.3", default-features = false, features = ["mint", "grpc"] }
cdk-payment-processor = { version = "0.17.3", default-features = false }
figment = { version = "0.10", features = ["env", "toml"] }
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

ark-lib = "0.6.1"
bark-bitcoin-ext = "0.6.1"
bark-wallet = { version = "0.6.1", features = ["onchain-bdk"] }
bip39 = "2.2"
bitcoin = "0.32"
futures = "0.3"
hex = "0.4"
lightning-invoice = "0.34"
redb = "4.1.0"
serde_json = "1"
uuid = { version = "1.0", features = ["v4"] }
