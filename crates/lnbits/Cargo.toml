[package]
name = "cdk-payment-processor-lnbits"
version = "0.1.0"
edition = "2021"
authors = ["CDK Developers"]
description = "CDK Payment Processor backed by an LNbits wallet"
license = "MIT OR Apache-2.0"

[features]
default = []
regtest-tests = ["dep:reqwest", "tokio/process"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
cdk-common = { version = "0.18.0", default-features = false, features = ["mint", "grpc"] }
cdk-payment-processor = { version = "0.18.0", default-features = false }
figment = { version = "0.10", features = ["env", "toml"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tokio-util = "0.7"
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# lnbits deps
futures = "0.3"
lnbits-rs = "0.9.2"
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

[[test]]
name = "regtest"
path = "tests/regtest.rs"
required-features = ["regtest-tests"]
